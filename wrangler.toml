name = "accountability"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Secrets, never in this file: BOT_TOKEN, SECRET, GROUP_ID
# Set with: npx wrangler secret put <NAME>

[[d1_databases]]
binding = "DB"
database_name = "accountability"
database_id = "paste-what-wrangler-d1-create-prints"  # an id, not a credential

# Cron is UTC. IST is UTC+5:30.
[triggers]
crons = [
  "0 16 * * *",    # 21:30 IST  name whoever has not logged today
  "30 2 * * *",    # 08:00 IST  yesterday's standings
  "30 14 * * 0",   # 20:00 IST Sunday  set next week's goals
]
